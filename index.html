<title>Hooksmith - Write. Shape. Release.</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Lora:ital,wght@0,400;1,400&family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f2ed;color:#2a2520;font-family:'DM Mono',monospace;min-height:100vh}
textarea,input,select{box-sizing:border-box;font-family:inherit}
textarea::placeholder,input::placeholder{color:#aaa}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#ccc}
.header{background:#1a1510;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:#c8a96e;letter-spacing:.02em;line-height:1}
.logo-tag{font-size:8px;letter-spacing:.22em;color:#4a4030;margin-top:3px}
.hbtns{display:flex;gap:10px}
.hbtn{background:none;border:none;color:#6a5a40;font-size:10px;cursor:pointer;letter-spacing:.1em;font-family:'DM Mono',monospace;transition:color .15s;padding:4px 8px}
.hbtn:hover,.hbtn.on{color:#c8a96e}
.main{max-width:680px;margin:0 auto;padding:36px 20px 60px}
.ti{width:100%;background:transparent;border:none;border-bottom:2px solid #ddd;color:#1a1510;padding:10px 0;font-size:20px;font-family:'Lora',serif;outline:none;margin-bottom:14px;transition:border-color .2s}
.ti:focus{border-bottom-color:#c8a96e}.ti::placeholder{color:#bbb}
.ta{width:100%;background:transparent;border:none;border-bottom:1px solid #ddd;color:#6a5a40;padding:8px 0;font-size:15px;font-family:'Lora',serif;resize:none;outline:none;margin-bottom:28px;transition:border-color .2s}
.ta:focus{border-bottom-color:#c8a96e}.ta::placeholder{color:#bbb}
.slabel{font-size:9px;color:#8a7a6a;letter-spacing:.18em;text-transform:uppercase;margin-bottom:12px}
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px}
.gtile{background:#fff;border:2px solid #e8e0d5;padding:12px 10px;cursor:pointer;text-align:left;transition:all .15s;border-radius:4px}
.gtile:hover,.gtile.sel{border-color:#c8a96e;background:#fdf8f0}
.gicon{font-size:18px;color:#c8a96e;margin-bottom:5px}
.glabel{font-size:12px;color:#2a2520;font-family:'DM Mono',monospace;font-weight:500;margin-bottom:2px}
.ghint{font-size:9px;color:#aaa;line-height:1.3}.gtile.sel .ghint{color:#8a7a6a}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.mpill{padding:8px 18px;border:2px solid #e0d8d0;background:#fff;font-size:12px;font-family:'DM Mono',monospace;cursor:pointer;transition:all .15s;border-radius:20px;color:#6a5a40}
.mpill:hover{border-color:#c8a96e}
.vrow{display:flex;gap:8px;margin-bottom:32px}
.vbtn{flex:1;padding:10px 8px;border:2px solid #e0d8d0;background:#fff;color:#6a5a40;font-size:11px;font-family:'DM Mono',monospace;cursor:pointer;transition:all .15s;border-radius:4px}
.vbtn:hover{border-color:#c8956e;color:#c8956e}.vbtn.sel{border-color:#c8956e;background:#fdf5ee;color:#c8956e;font-weight:500}
.etog{background:none;border:none;font-size:10px;cursor:pointer;font-family:'DM Mono',monospace;letter-spacing:.15em;display:flex;align-items:center;gap:8px;margin-bottom:20px;padding:0;transition:color .2s}
.earr{font-size:14px;display:inline-block;transition:transform .2s}
.ehint{color:#ccc;font-size:9px;margin-left:4px}
.spanel{background:#f0eeff;border:1px solid #d0c8ff;border-left:3px solid #9a8aee;padding:20px;margin-bottom:20px;border-radius:4px}
.stitle{font-size:16px;color:#6a5aee;font-family:'Cormorant Garamond',serif;font-style:italic;margin-bottom:4px}
.sdesc{font-size:10px;color:#8a80b0;line-height:1.6;margin-bottom:12px}
.sta{width:100%;background:#faf8ff;border:1px solid #d0c8ff;border-left:2px solid #9a8aee;color:#3a2a6a;padding:12px 14px;font-size:14px;line-height:1.8;font-family:'Lora',serif;font-style:italic;resize:none;outline:none;margin-bottom:14px;border-radius:2px}
.srlabel{font-size:9px;color:#8a80b0;letter-spacing:.15em;margin-bottom:8px}

.gbtn{width:100%;padding:16px;background:#c8a96e;border:none;color:#fff;font-size:13px;letter-spacing:.15em;cursor:pointer;font-family:'DM Mono',monospace;font-weight:500;border-radius:4px;transition:all .2s;margin-bottom:8px}
.gbtn:hover:not(:disabled){background:#d4b87a;transform:translateY(-1px);box-shadow:0 4px 12px rgba(200,169,110,.3)}
.gbtn:disabled{background:#ddd;color:#aaa;cursor:default;transform:none}
.gstatus{font-size:9px;color:#aaa;letter-spacing:.1em;margin-bottom:24px;text-align:center}
.obox{background:#fff;border:1px solid #e0d8d0;border-left:3px solid #c8a96e;padding:18px;margin-bottom:10px;border-radius:4px}
.otext{color:#3a2a10;font-size:14px;line-height:1.8;font-family:'Lora',serif;outline:none;min-height:60px}
.ofooter{display:flex;justify-content:space-between;align-items:center}
.ccount{font-size:10px}.obtns{display:flex;gap:6px}
.rbtn{padding:7px 14px;background:transparent;border:1px solid #e0d8d0;color:#8a7a6a;font-size:10px;cursor:pointer;font-family:'DM Mono',monospace;border-radius:4px}
.cpbtn{padding:7px 18px;background:#c8a96e;border:none;color:#fff;font-size:10px;cursor:pointer;font-family:'DM Mono',monospace;border-radius:4px;transition:all .2s}
.cpbtn.ok{background:#5a9a5a}
.panel{background:#fff;border:1px solid #e0d8d0;padding:20px;margin-bottom:24px;border-radius:8px}
.ptitle{font-size:9px;color:#8a7a6a;letter-spacing:.15em;text-transform:uppercase;margin-bottom:14px}
.hitem{background:#f9f6f2;border:1px solid #e8e0d5;border-radius:4px;padding:10px 12px;margin-bottom:8px}
.hitop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.htitle{font-size:13px;color:#2a2520;font-family:'Lora',serif;font-style:italic}
.hcluster{font-size:9px;color:#c8956e;margin-left:8px}
.hprev{font-size:11px;color:#8a7a6a;font-family:'Lora',serif;line-height:1.5}
.ubtn{padding:2px 10px;background:transparent;border:1px solid #e0d8d0;color:#8a7a6a;font-size:9px;cursor:pointer;font-family:'DM Mono',monospace;border-radius:2px}
.ubtn:hover{border-color:#c8a96e;color:#c8a96e}
.dbtn{background:none;border:none;color:#ccc;font-size:11px;cursor:pointer;padding:0 4px}
.dbtn:hover{color:#e05555}
.stars{display:flex;gap:3px;align-items:center;margin-top:4px}
.star{background:none;border:none;cursor:pointer;font-size:14px;padding:1px;transition:color .1s}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.mi,.ms{width:100%;background:#f9f6f2;border:1px solid #e0d8d0;color:#2a2520;padding:8px 10px;font-size:12px;outline:none;border-radius:2px;font-family:'DM Mono',monospace}
.mta{width:100%;background:#f9f6f2;border:1px solid #e0d8d0;color:#2a2520;padding:10px;font-size:12px;line-height:1.6;font-family:'Lora',serif;resize:vertical;outline:none;margin-bottom:8px;border-radius:2px}
.svbtn{padding:8px 20px;background:#7a9e8a;border:none;color:#fff;font-size:10px;cursor:pointer;font-family:'DM Mono',monospace;border-radius:4px}
.svbtn:disabled{background:#ddd;color:#aaa;cursor:default}
.flash{font-size:10px;color:#5a9a5a;margin-left:10px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

</style>

var PROXY = '/.netlify/functions/claude';
var GENRES = [
  {id:"Ballad",label:"Ballad",icon:"\u2665",hint:"Tender, emotional, piano or strings"},
  {id:"Pop",label:"Pop",icon:"\u25c9",hint:"Catchy, warm, anthemic"},
  {id:"Folk",label:"Folk",icon:"\u25ce",hint:"Acoustic, gentle, storytelling"},
  {id:"Country",label:"Country",icon:"\u27b6",hint:"Heartfelt, roots, open roads"},
  {id:"Rock",label:"Rock",icon:"\u2593",hint:"From tender acoustic to powerful"},
  {id:"Electronic",label:"Electronic",icon:"\u25c8",hint:"Modern, atmospheric, beats"},
  {id:"Hip-Hop",label:"Hip-Hop",icon:"\u2295",hint:"Spoken from the heart, rhythmic"},
  {id:"Cinematic",label:"Cinematic",icon:"\u2298",hint:"Something different, unique, yours"}
];
var MOODS = [
  {id:"Dark",color:"#6a5aaa"},{id:"Warm",color:"#c8784e"},
  {id:"Euphoric",color:"#a89020"},{id:"Melancholic",color:"#4a8a6a"},{id:"Raw",color:"#a07830"}
];
var VOCALS = ["Female","Male","Duo","Instrumental"];
var SEED_ROLES = ["chorus","opening line","verse","bridge","outro","title","not sure"];
var LYRIC_SECS = [
  {id:"verse",label:"Verse",ph:"Set the scene..."},
  {id:"prechorus",label:"Pre-Chorus",ph:"Build the tension..."},
  {id:"chorus",label:"Chorus",ph:"The emotional peak..."},
  {id:"bridge",label:"Bridge",ph:"The turn..."},
  {id:"outro",label:"Outro",ph:"Resolution or fade..."}
];
var CLUSTERS = ["Ballad","Electronic","Folk","Rock","Hip-Hop","Country","Cinematic","Pop","My Prompts"];
var STAR_COLORS = ["#ddd","#e05555","#e09455","#e0c855","#a0c855","#5ac855"];
var STAR_LABELS = ["","weak","fair","good","great","perfect"];

var S = {
  title:"",theme:"",genre:null,mood:null,vocal:null,
  seed:"",seedRole:null,songOpen:false,deepOpen:false,
  lyrics:{verse:"",prechorus:"",chorus:"",bridge:"",outro:""},
  prompt:"",loading:false,copied:false,
  seedResult:null,seedBuilding:false,
  history:[],myPrompts:[],
  showHistory:false,showMine:false,
  mTitle:"",mCluster:"My Prompts",mText:"",flash:false
};

try{var _h=localStorage.getItem("hs-h");if(_h)S.history=JSON.parse(_h);}catch(e){}
try{var _p=localStorage.getItem("hs-p");if(_p)S.myPrompts=JSON.parse(_p);}catch(e){}

function saveData(){
  try{localStorage.setItem("hs-h",JSON.stringify(S.history.slice(0,50)));}catch(e){}
  try{localStorage.setItem("hs-p",JSON.stringify(S.myPrompts));}catch(e){}
}

function set(u){Object.assign(S,u);render();}

function mkEl(tag,cls,attrs){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(attrs)Object.keys(attrs).forEach(function(k){
    if(k==="style"&&typeof attrs[k]==="object"){Object.assign(e.style,attrs[k]);}
    else if(k.indexOf("on")===0){e[k]=attrs[k];}
    else{e.setAttribute(k,attrs[k]);}
  });
  return e;
}
function add(parent){
  for(var i=1;i<arguments.length;i++){
    var c=arguments[i];
    if(c==null||c===false||c===undefined)continue;
    if(typeof c==="string"||typeof c==="number"){
      parent.appendChild(document.createTextNode(String(c)));
    } else {
      parent.appendChild(c);
    }
  }
  return parent;
}

function buildPromptContent(){
  var parts = [];
  parts.push("Title: " + (S.title||"Untitled"));
  parts.push("Genre: " + (S.genre||"unspecified"));
  parts.push("Mood: " + (S.mood||"unspecified"));
  parts.push("Vocal: " + (S.vocal ? S.vocal+" vocal" : "unspecified"));
  parts.push("Theme: " + (S.theme||"none"));
  if(S.seed){
    parts.push("");
    parts.push("Seed line (sacred, build around it): \"" + S.seed + "\"");
  }
  var lyrParts = LYRIC_SECS.filter(function(s){return S.lyrics[s.id].trim();})
    .map(function(s){return "["+s.label+"]\n"+S.lyrics[s.id];});
  if(lyrParts.length>0){
    parts.push("");
    parts.push("Lyrics:");
    parts.push(lyrParts.join("\n\n"));
  }
  return parts.join("\n");
}

async function generate(){
  if(S.loading)return;
  set({loading:true,prompt:""});
  try{
    var res=await fetch(PROXY,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        system:"You are an expert Suno AI prompt writer. Output ONLY the prompt text, no preamble or explanation. Stay under 950 characters. No artist names. Map the full production arc: how the song opens, builds, peaks and ends. End with vocal descriptor.",
        messages:[{role:"user",content:"Generate a Suno prompt for:\n"+buildPromptContent()}]
      })
    });
    var data=await res.json();
    var text = (data.content?.[0]?.text || JSON.stringify(data)).trim();
    if(data.content&&data.content[0]&&data.content[0].text){text=data.content[0].text.trim();}
    var entry={id:Date.now(),title:S.title||"Untitled",genre:S.genre||"",prompt:text,rating:0,
      savedAt:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"2-digit"})};
    S.history=[entry].concat(S.history).slice(0,50);
    saveData();
    set({loading:false,prompt:text});
  }catch(e){
    set({loading:false,prompt:"Connection error. Make sure ANTHROPIC_API_KEY is set in Vercel environment variables."});
  }
}

async function buildSeed(){
  if(!S.seed.trim()||S.seedBuilding)return;
  set({seedBuilding:true,seedResult:null});
  var seedContent = "My seed line: \"" + S.seed + "\"\n";
  seedContent += "This feels like my: " + (S.seedRole||"unknown") + "\n";
  seedContent += "Genre: " + (S.genre||"unspecified") + "\n";
  seedContent += "Mood: " + (S.mood||"unspecified") + "\n";
  seedContent += "Theme: " + (S.theme||"none") + "\n\n";
  seedContent += "Build the rest of the song around my line.";
  try{
    var res=await fetch(PROXY,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        system:"You are a skilled co-writer. The seed line is sacred - never rewrite it. Build the song around it. Use section labels [Verse], [Chorus], [Bridge] etc. 2-4 lines per section. End with one sentence explaining the emotional logic.",
        messages:[{role:"user",content:seedContent}]
      })
    });
    var data=await res.json();
    var text="Error. Please try again.";
    if(data.content&&data.content[0]&&data.content[0].text){text=data.content[0].text.trim();}
    set({seedBuilding:false,seedResult:text});
  }catch(e){set({seedBuilding:false,seedResult:"Error. Please try again."});}
}

function applyToSong(text){
  var secs={verse:"",prechorus:"",chorus:"",bridge:"",outro:""};
  var cur=null;
  text.split("\n").forEach(function(line){
    var l=line.toLowerCase();
    if(l.indexOf("[verse]")>=0){cur="verse";return;}
    if(l.indexOf("[pre-chorus]")>=0||l.indexOf("[prechorus]")>=0){cur="prechorus";return;}
    if(l.indexOf("[chorus]")>=0){cur="chorus";return;}
    if(l.indexOf("[bridge]")>=0){cur="bridge";return;}
    if(l.indexOf("[outro]")>=0){cur="outro";return;}
    if(cur&&line.trim()){secs[cur]+=(secs[cur]?"\n":"")+line;}
  });
  var nl=Object.assign({},S.lyrics);
  Object.keys(secs).forEach(function(k){if(secs[k].trim()&&!nl[k])nl[k]=secs[k].trim();});
  set({lyrics:nl});
}

function render(){
  var appEl=document.getElementById("app");
  if(!appEl)return;
  appEl.innerHTML="";

  // HEADER
  var logoImg=mkEl("img","",{src:LOGO_SRC,alt:"Hooksmith",style:{width:"42px",height:"42px",objectFit:"contain"}});
  var logoName=add(mkEl("div","logo-name"),"Hooksmith");
  var logoTag=add(mkEl("div","logo-tag"),"WRITE. SHAPE. RELEASE.");
  var logoText=add(mkEl("div"),logoName,logoTag);
  var logoWrap=add(mkEl("div","logo-wrap"),logoImg,logoText);
  var hbtnH=add(mkEl("button","hbtn"+(S.showHistory?" on":""),{onclick:function(){set({showHistory:!S.showHistory,showMine:false});}}),
    "HISTORY"+(S.history.length>0?" ("+S.history.length+")":""));
  var hbtnM=add(mkEl("button","hbtn"+(S.showMine?" on":""),{onclick:function(){set({showMine:!S.showMine,showHistory:false});}}),
    "MY PROMPTS"+(S.myPrompts.length>0?" ("+S.myPrompts.length+")":""));
  var header=add(mkEl("div","header"),logoWrap,add(mkEl("div","hbtns"),hbtnH,hbtnM));
  appEl.appendChild(header);

  var main=mkEl("div","main");

  // HISTORY PANEL
  if(S.showHistory){
    var hp=mkEl("div","panel");
    add(hp,add(mkEl("div","ptitle"),"GENERATION HISTORY"));
    if(S.history.length===0){
      add(hp,add(mkEl("div",null,{style:{color:"#aaa",fontSize:"13px"}}),"No history yet"));
    } else {
      S.history.forEach(function(entry){
        var item=mkEl("div","hitem");
        var useBtn=add(mkEl("button","ubtn",{onclick:(function(e){return function(){set({prompt:e.prompt,showHistory:false});};})(entry)}),"USE");
        var delBtn=add(mkEl("button","dbtn",{onclick:(function(e){return function(){S.history=S.history.filter(function(x){return x.id!==e.id;});saveData();set({});};})(entry)}),"\u00d7");
        var top=add(mkEl("div","hitop"),
          add(mkEl("span"),add(mkEl("span","htitle"),entry.title),entry.genre?add(mkEl("span","hcluster"),entry.genre):""),
          add(mkEl("div",null,{style:{display:"flex",gap:"6px"}}),useBtn,delBtn));
        add(item,top);
        var stars=mkEl("div","stars");
        for(var n=1;n<=5;n++){
          (function(nn,eid,erat){
            var star=mkEl("button","star",{style:{color:nn<=(erat||0)?STAR_COLORS[erat||0]:"#ddd"},
              onclick:function(){S.history=S.history.map(function(x){return x.id===eid?Object.assign({},x,{rating:x.rating===nn?0:nn}):x;});saveData();set({});}});
            star.textContent="\u2605";
            stars.appendChild(star);
          })(n,entry.id,entry.rating);
        }
        if((entry.rating||0)>0){
          add(stars,add(mkEl("span",null,{style:{fontSize:"9px",color:STAR_COLORS[entry.rating],marginLeft:"4px",fontFamily:"'DM Mono',monospace"}}),STAR_LABELS[entry.rating]));
        }
        add(item,stars,add(mkEl("div","hprev"),entry.prompt.slice(0,140)+"\u2026"));
        hp.appendChild(item);
      });
      var clrBtn=add(mkEl("button",null,{style:{marginTop:"8px",padding:"5px 12px",background:"transparent",border:"1px solid #e0d8d0",color:"#aaa",fontSize:"9px",cursor:"pointer",fontFamily:"'DM Mono',monospace",borderRadius:"2px"},onclick:function(){S.history=[];saveData();set({});}}),"CLEAR ALL");
      hp.appendChild(clrBtn);
    }
    main.appendChild(hp);
  }

  // MY PROMPTS PANEL
  if(S.showMine){
    var mp=mkEl("div","panel");
    add(mp,add(mkEl("div","ptitle"),"MY PROMPT BANK"));
    var mgrid=mkEl("div","mgrid");
    var mti=mkEl("input","mi",{type:"text",placeholder:"Title...",value:S.mTitle,oninput:function(e){S.mTitle=e.target.value;}});
    var msel=mkEl("select","ms",{onchange:function(e){S.mCluster=e.target.value;}});
    CLUSTERS.forEach(function(c){var o=mkEl("option");o.value=c;o.textContent=c;if(c===S.mCluster)o.selected=true;msel.appendChild(o);});
    add(mgrid,mti,msel);
    var mta=mkEl("textarea","mta",{rows:4,placeholder:"Paste a Suno prompt that worked well...",oninput:function(e){S.mText=e.target.value;}});
    mta.textContent=S.mText;
    var svBtn=add(mkEl("button","svbtn",{disabled:S.mText.trim()?undefined:true,onclick:function(){
      if(!S.mText.trim())return;
      S.myPrompts=[{id:Date.now(),title:S.mTitle||"Untitled",cluster:S.mCluster,text:S.mText,
        savedAt:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"2-digit"})}].concat(S.myPrompts);
      saveData();set({mText:"",mTitle:"",flash:true});
      setTimeout(function(){set({flash:false});},1800);
    }}),"SAVE");
    var saveRow=add(mkEl("div",null,{style:{display:"flex",alignItems:"center",gap:"10px"}}),svBtn);
    if(S.flash)add(saveRow,add(mkEl("span","flash"),"\u2713 saved"));
    add(mp,mgrid,mta,saveRow);
    S.myPrompts.forEach(function(p){
      var del=add(mkEl("button","dbtn",{onclick:(function(pid){return function(){S.myPrompts=S.myPrompts.filter(function(x){return x.id!==pid;});saveData();set({});};})(p.id)}),"\u00d7");
      mp.appendChild(add(mkEl("div","hitem"),add(mkEl("div","hitop"),
        add(mkEl("span"),add(mkEl("span","htitle"),p.title),add(mkEl("span","hcluster"),p.cluster)),del)));
    });
    main.appendChild(mp);
  }

  // TITLE
  var ti=mkEl("input","ti",{type:"text",placeholder:"What do you want to call it? (optional)",value:S.title,oninput:function(e){S.title=e.target.value;}});
  main.appendChild(ti);

  // THEME
  var themeEl=mkEl("textarea","ta",{rows:2,placeholder:"Who is it for? What do you want to say to them? (optional)",oninput:function(e){S.theme=e.target.value;}});
  themeEl.textContent=S.theme;
  main.appendChild(themeEl);

  // GENRE
  var gg=add(mkEl("div"),add(mkEl("div","slabel"),"GENRE"));
  var ggrid=mkEl("div","ggrid");
  GENRES.forEach(function(g){
    var tile=mkEl("button","gtile"+(S.genre===g.id?" sel":""),{onclick:(function(gid){return function(){set({genre:S.genre===gid?null:gid});};})(g.id)});
    add(tile,add(mkEl("div","gicon"),g.icon),add(mkEl("div","glabel"),g.label),add(mkEl("div","ghint"),g.hint));
    ggrid.appendChild(tile);
  });
  add(gg,ggrid);
  main.appendChild(gg);

  // MOOD
  var mg=add(mkEl("div"),add(mkEl("div","slabel"),"MOOD"));
  var mrow=mkEl("div","mrow");
  MOODS.forEach(function(m){
    var pill=mkEl("button","mpill"+(S.mood===m.id?" sel":""),{onclick:(function(mid,mc){return function(){set({mood:S.mood===mid?null:mid});};})(m.id,m.color)});
    if(S.mood===m.id)Object.assign(pill.style,{background:m.color,borderColor:m.color,color:"#fff"});
    if(S.mood&&S.mood!==m.id)pill.style.opacity="0.4";
    pill.textContent=m.id;
    mrow.appendChild(pill);
  });
  add(mg,mrow);
  main.appendChild(mg);

  // VOCAL
  var vg=add(mkEl("div"),add(mkEl("div","slabel"),"VOCAL"));
  var vrow=mkEl("div","vrow");
  VOCALS.forEach(function(v){
    var vb=mkEl("button","vbtn"+(S.vocal===v?" sel":""),{onclick:(function(vv){return function(){set({vocal:S.vocal===vv?null:vv});};})(v)});
    vb.textContent=v;
    vrow.appendChild(vb);
  });
  add(vg,vrow);
  main.appendChild(vg);

  // SONG TOGGLE
  var stog=mkEl("button","etog",{style:{color:S.songOpen?"#9a8aee":"#aaa"},onclick:function(){set({songOpen:!S.songOpen});}});
  var sarr=mkEl("span","earr");
  sarr.style.transform=S.songOpen?"rotate(90deg)":"rotate(0deg)";
  sarr.textContent="\u203a";
  add(stog,sarr,S.songOpen?" \u2190 HIDE SONG":" BUILD YOUR SONG \u2192");
  if(!S.songOpen)add(stog,add(mkEl("span","ehint"),"ONE LINE \u00b7 AI BUILDS AROUND IT \u00b7 VERSE \u00b7 CHORUS"));
  main.appendChild(stog);

  if(S.songOpen){
    var sp=mkEl("div","spanel");
    add(sp,add(mkEl("div","stitle"),"Your line"));
    add(sp,add(mkEl("div","sdesc"),"One line. A movie title. A headline. Something that won\u2019t leave you alone. Anything."));
    var sta=mkEl("textarea","sta",{rows:3,placeholder:"\"She left her shoes at the bottom of the stairs\"",oninput:function(e){S.seed=e.target.value;}});
    sta.textContent=S.seed;
    add(sp,sta);
    add(sp,add(mkEl("div","srlabel"),"THIS FEELS LIKE MY..."));
    var sroles=mkEl("div","sroles");
    SEED_ROLES.forEach(function(role){
      var rb=mkEl("button","srbtn"+(S.seedRole===role?" sel":""),{onclick:(function(r){return function(){set({seedRole:S.seedRole===r?null:r});};})(role)});
      rb.textContent=role;
      sroles.appendChild(rb);
    });
    add(sp,sroles);
    var sbb=mkEl("button","sbbtn",{onclick:buildSeed});
    if(!S.seed.trim()||S.seedBuilding)sbb.disabled=true;
    sbb.textContent=S.seedBuilding?"BUILDING...":"\u2726 BUILD AROUND THIS";
    add(sp,sbb);
    if(S.seedResult){
      var sres=mkEl("div","sres");
      add(sres,add(mkEl("div","sreslabel"),"CO-WRITER \u2014 built around your line"));
      add(sres,add(mkEl("pre","srestext"),S.seedResult));
      var applyBtn=add(mkEl("button","applybtn",{onclick:function(){applyToSong(S.seedResult);}}),"\u2193 APPLY TO SONG BELOW");
      add(sres,applyBtn);
      add(sp,sres);
    }
    main.appendChild(sp);

    add(main,add(mkEl("div","slabel",{style:{marginBottom:"10px"}}),"FULL SONG \u2014 edit freely"));
    LYRIC_SECS.forEach(function(s){
      var lta=mkEl("textarea","lta"+(S.lyrics[s.id]?" has":""),{rows:s.id==="chorus"?4:3,placeholder:s.ph,oninput:(function(sid){return function(e){S.lyrics[sid]=e.target.value;};})(s.id)});
      lta.textContent=S.lyrics[s.id];
      main.appendChild(add(mkEl("div","lsec"),add(mkEl("div","llabel"),s.label),lta));
    });
  }

  // GO DEEPER
  var dtog=mkEl("button","etog",{style:{color:S.deepOpen?"#c8a96e":"#aaa",marginTop:"8px"},onclick:function(){set({deepOpen:!S.deepOpen});}});
  var darr=mkEl("span","earr");
  darr.style.transform=S.deepOpen?"rotate(90deg)":"rotate(0deg)";
  darr.textContent="\u203a";
  add(dtog,darr,S.deepOpen?" \u2190 KEEP IT SIMPLE":" GO DEEPER \u2192");
  if(!S.deepOpen)add(dtog,add(mkEl("span","ehint"),"BPM \u00b7 KEY \u00b7 INSTRUMENTS \u00b7 ERA"));
  main.appendChild(dtog);

  if(S.deepOpen){
    main.appendChild(add(mkEl("div",null,{style:{background:"#fdf8f0",border:"1px solid #e8d8b0",borderLeft:"3px solid #c8a96e",padding:"16px",marginBottom:"20px",borderRadius:"4px"}}),
      add(mkEl("div",null,{style:{fontSize:"9px",color:"#a08040",letterSpacing:".18em",marginBottom:"10px"}}),"SIMPLE BY DEFAULT \u00b7 DEEP ON DEMAND"),
      add(mkEl("div",null,{style:{fontSize:"13px",color:"#8a7a6a",fontFamily:"'Lora',serif",fontStyle:"italic"}}),"Use the theme field above to describe BPM, key, instruments, or era in plain language. Full controls coming soon.")
    ));
  }

  // GENERATE
  var gbtn=mkEl("button","gbtn",{onclick:generate});
  if(S.loading)gbtn.disabled=true;
  gbtn.textContent=S.loading?"GENERATING...":"GENERATE SUNO PROMPT";
  main.appendChild(gbtn);
  var gstatus=mkEl("div","gstatus");
  gstatus.textContent=S.genre?(S.genre+(S.mood?" \u00b7 "+S.mood:"")+(S.vocal?" \u00b7 "+S.vocal:"")+(S.seed?" \u00b7 seed active":"")):"choose a genre above, or just generate";
  main.appendChild(gstatus);

  // OUTPUT
  if(S.prompt){
    var cc=S.prompt.length;
    var ccolor=cc>950?"#e05555":cc>800?"#e09455":"#4a8a4a";
    var otext=mkEl("div","otext",{contenteditable:"true",oninput:function(e){S.prompt=e.textContent;}});
    otext.textContent=S.prompt;
    var obox=add(mkEl("div","obox"),otext);
    var ccnt=add(mkEl("span","ccount",{style:{color:ccolor}}),cc+" / 950 chars");
    var rbtn=add(mkEl("button","rbtn",{onclick:generate}),"\u21ba RETRY");
    var cpbtn=mkEl("button","cpbtn"+(S.copied?" ok":""),{onclick:function(){navigator.clipboard.writeText(S.prompt);set({copied:true});setTimeout(function(){set({copied:false});},2000);}});
    cpbtn.textContent=S.copied?"\u2713 COPIED":"COPY TO SUNO";
    main.appendChild(add(mkEl("div"),obox,add(mkEl("div","ofooter"),ccnt,add(mkEl("div","obtns"),rbtn,cpbtn))));
  }

  appEl.appendChild(main);
}

render();

</script>
</body>
