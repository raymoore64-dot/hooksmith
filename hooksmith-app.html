  if (attrs) Object.keys(attrs).forEach(function(k) {
    var v = attrs[k];
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.indexOf('on') === 0) e[k.toLowerCase()] = v;
    else e.setAttribute(k, v);
  });
  if (kids) kids.forEach(function(c) {
    if (c == null || c === false) return;
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  });
  return e;
}

function txt(t) { return document.createTextNode(t); }

function dtoggle(arr, val) {
  var i = arr.indexOf(val);
  if (i >= 0) arr.splice(i,1); else arr.push(val);
}

function buildContent() {
  var genre = (state.deepOpen && state.deepGenres.length > 0) ? state.deepGenres.join(', ') : (state.genre || 'unspecified');
  var mood = (state.deepOpen && state.deepMoods.length > 0) ? state.deepMoods.join(', ') : (state.mood || 'unspecified');
  var vocal = (state.deepOpen && state.deepVocal) ? state.deepVocal : (state.vocal ? state.vocal + ' vocal' : 'unspecified');
  var lines = [
    'Title: ' + (state.title || 'Untitled'),
    'Genre: ' + genre,
    'Mood: ' + mood,
    'Vocal: ' + vocal,
    'Theme: ' + (state.theme || 'none')
  ];
  if (state.deepOpen && state.deepInstruments.length > 0) lines.push('Instruments: ' + state.deepInstruments.join(', '));
  if (state.deepOpen && state.deepEra.length > 0) lines.push('Era: ' + state.deepEra.join(', '));
  if (state.bpm) lines.push('BPM: ' + state.bpm);
  if (state.songKey) lines.push('Key: ' + state.songKey);
  if (state.timeSig) lines.push('Time: ' + state.timeSig);
  var result = lines.join('\n');
  if (state.seed) result += '\n\nSeed line (sacred, build around it): "' + state.seed + '"';
  var lyr = LYRIC_IDS.filter(function(id) { return state.lyrics[id].trim(); }).map(function(id,i) { return '[' + LYRIC_LABELS[i] + ']\n' + state.lyrics[id]; }).join('\n\n');
  if (lyr) result += '\n\nLyrics:\n' + lyr;
  return result;
}

function generate() {
  if (state.loading) return;
  set({loading:true, generatedPrompt:''});
  fetch(PROXY, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 1000,
      system: 'You are an expert Suno AI prompt writer. Output ONLY the prompt text, no preamble. Stay under 950 characters. No artist names. Map the full production arc. End with vocal descriptor.',
      messages: [{role:'user', content:'Generate a Suno prompt for:\n\n' + buildContent()}]
    })
  }).then(function(r) { return r.json(); }).then(function(d) {
    var text = (d.content && d.content[0] && d.content[0].text) ? d.content[0].text.trim() : JSON.stringify(d);
    var entry = {id:Date.now(), title:state.title||'Untitled', genre:state.genre||'', mood:state.mood||'', prompt:text, rating:0, savedAt:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'})};
    state.history = [entry].concat(state.history).slice(0,50);
    save();
    set({loading:false, generatedPrompt:text});
  }).catch(function() {
    set({loading:false, generatedPrompt:'Connection error. Please try again.'});
  });
}

function buildSeed() {
  if (!state.seed.trim() || state.seedBuilding) return;
  set({seedBuilding:true, seedResult:null});
  var genre = state.genre || 'unspecified';
  var mood = state.mood || 'unspecified';
  var content = 'My seed line: "' + state.seed + '"\nThis feels like my: ' + (state.seedRole || 'unknown') + '\nGenre: ' + genre + '\nMood: ' + mood + '\nTheme: ' + (state.theme || 'none') + '\n\nBuild the rest of the song around my line.';
  fetch(PROXY, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-5',
      max_tokens:1000,
      system:'You are a skilled co-writer. The seed line is sacred - never rewrite or replace it. Build the song around it. Use section labels [Verse], [Chorus], [Bridge] etc. 2-4 lines per section. End with one sentence explaining the emotional logic.',
      messages:[{role:'user', content:content}]
    })
  }).then(function(r) { return r.json(); }).then(function(d) {
    var text = (d.content && d.content[0] && d.content[0].text) ? d.content[0].text.trim() : 'Error';
    set({seedBuilding:false, seedResult:text});
  }).catch(function() {
    set({seedBuilding:false, seedResult:'Error. Please try again.'});
  });
}

function applyToSong(text) {
  var secs = {verse:'',prechorus:'',chorus:'',bridge:'',outro:''};
  var cur = null;
  text.split('\n').forEach(function(line) {
    var l = line.toLowerCase();
    if (l.indexOf('[verse]') >= 0) { cur='verse'; return; }
    if (l.indexOf('[pre-chorus]') >= 0 || l.indexOf('[prechorus]') >= 0) { cur='prechorus'; return; }
    if (l.indexOf('[chorus]') >= 0) { cur='chorus'; return; }
    if (l.indexOf('[bridge]') >= 0) { cur='bridge'; return; }
    if (l.indexOf('[outro]') >= 0) { cur='outro'; return; }
    if (cur && line.trim()) secs[cur] += (secs[cur] ? '\n' : '') + line;
  });
  var nl = Object.assign({}, state.lyrics);
  Object.keys(secs).forEach(function(k) { if (secs[k].trim() && !nl[k]) nl[k] = secs[k].trim(); });
  set({lyrics:nl});
}


function render() {
  var app = document.getElementById('app');
  if (!app) return;
  app.innerHTML = '';

  // HEADER
  var hdr = mk('div','header',null,[
    mk('div','header-logo',null,[
      mk('img',null,{src:LOGO_SRC, alt:'Hooksmith', style:{width:'42px',height:'42px',objectFit:'contain'}}),
      mk('div',null,null,[
        mk('div','logo-text',null,['Hooksmith']),
        mk('div','logo-tag',null,['WRITE. SHAPE. RELEASE.'])
      ])
    ]),
    mk('div','header-btns',null,[
      mk('button','hbtn' + (state.showHistory?' active':''),{onclick:function(){ set({showHistory:!state.showHistory,showMine:false}); }},['HISTORY' + (state.history.length > 0 ? ' ('+state.history.length+')' : '')]),
      mk('button','hbtn' + (state.showMine?' active':''),{onclick:function(){ set({showMine:!state.showMine,showHistory:false}); }},['MY PROMPTS' + (state.myPrompts.length > 0 ? ' ('+state.myPrompts.length+')' : '')])
    ])
  ]);

  var main = mk('div','main');

  // HISTORY
  if (state.showHistory) {
    var hitems = state.history.length === 0 ? [mk('div',null,{style:{color:'#4a3a20',fontSize:'13px'}},['No history yet'])] :
      state.history.map(function(entry) {
        var r = entry.rating || 0;
        return mk('div','hitem',null,[
          mk('div','hitop',null,[
            mk('span',null,null,[mk('span','htitle',null,[entry.title]), entry.genre ? mk('span','hcluster',null,[entry.genre]) : null]),
            mk('div',null,{style:{display:'flex',gap:'6px',alignItems:'center'}},[
              mk('button','ubtn',{onclick:function(){ set({generatedPrompt:entry.prompt,showHistory:false}); }},['USE']),
              mk('button','dbtn',{onclick:function(){ state.history=state.history.filter(function(x){return x.id!==entry.id;}); save(); set({}); }},['x'])
            ])
          ]),
          mk('div','stars',null,
            [1,2,3,4,5].map(function(n){
              return mk('button','star',{style:{color: n<=r ? STAR_COLORS[r] : '#2a2218'},onclick:function(){ state.history=state.history.map(function(x){ return x.id===entry.id ? Object.assign({},x,{rating:x.rating===n?0:n}) : x; }); save(); set({}); }},['★']);
            }).concat([r > 0 ? mk('span',null,{style:{fontSize:'9px',color:STAR_COLORS[r],marginLeft:'4px',fontFamily:"'DM Mono',monospace"}},[STAR_LABELS[r]]) : null])
          ),
          mk('div','hprev',null,[entry.prompt.slice(0,140)+'…'])
        ]);
      });
    var clearBtn = mk('button',null,{style:{marginTop:'8px',padding:'5px 12px',background:'transparent',border:'1px solid #2a2218',color:'#4a3a20',fontSize:'9px',cursor:'pointer',fontFamily:"'DM Mono',monospace",borderRadius:'2px'},onclick:function(){state.history=[];save();set({});}},['CLEAR ALL']);
    main.appendChild(mk('div','panel',null,[mk('div','ptitle',null,['HISTORY'])].concat(hitems).concat([clearBtn])));
  }

  // MY PROMPTS
  if (state.showMine) {
    var sel = mk('select','msel',{onchange:function(e){state.newCluster=e.target.value;}});
    CLUSTERS.forEach(function(c){ var o=mk('option',null,{value:c},[c]); if(c===state.newCluster) o.selected=true; sel.appendChild(o); });
    var mineItems = [
      mk('div',null,{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'8px'}},[
        mk('input','minput',{type:'text',placeholder:'Title...',value:state.newTitle,oninput:function(e){state.newTitle=e.target.value;}}),
        sel
      ]),
      mk('textarea','mta',{rows:'4',placeholder:'Paste a Suno prompt that worked well...',oninput:function(e){state.newText=e.target.value;}},[state.newText]),
      mk('div',null,{style:{display:'flex',alignItems:'center',gap:'10px'}},[
        mk('button','savebtn',{onclick:function(){
          if(!state.newText.trim()) return;
          state.myPrompts=[{id:Date.now(),title:state.newTitle||'Untitled',cluster:state.newCluster,text:state.newText,savedAt:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'})}].concat(state.myPrompts);
          save(); set({newText:'',newTitle:'',savedFlash:true});
          setTimeout(function(){set({savedFlash:false});},1800);
        }},['SAVE']),
        state.savedFlash ? mk('span','flash',null,['✓ saved']) : null
      ])
    ].concat(state.myPrompts.map(function(p){
      return mk('div','hitem',{style:{marginTop:'6px'}},[ mk('div','hitop',null,[mk('span',null,null,[mk('span','htitle',null,[p.title]),mk('span','hcluster',null,[p.cluster])]), mk('button','dbtn',{onclick:function(){state.myPrompts=state.myPrompts.filter(function(x){return x.id!==p.id;});save();set({});}},['×'])]) ]);
    }));
    main.appendChild(mk('div','panel',null,[mk('div','ptitle',null,['MY PROMPT BANK'])].concat(mineItems)));
  }

  // TITLE + THEME
  main.appendChild(mk('input',null,{type:'text',className:'title-input',placeholder:'What do you want to call it? (optional)',value:state.title,oninput:function(e){state.title=e.target.value;}}));
  main.appendChild(mk('textarea',null,{className:'theme-input',rows:'2',placeholder:'Who is it for? What do you want to say to them? (optional)',oninput:function(e){state.theme=e.target.value;}},[state.theme]));

  // GENRE
  main.appendChild(mk('div','slabel',null,['GENRE']));
  main.appendChild(mk('div','genre-grid',null, GENRES.map(function(g){
    return mk('button','gtile'+(state.genre===g.id?' sel':''),{onclick:function(){set({genre:state.genre===g.id?null:g.id});}},[ mk('div','gicon',null,[g.icon]), mk('div','glabel',null,[g.label]), mk('div','ghint',null,[g.hint]) ]);
  })));

  // MOOD
  main.appendChild(mk('div','slabel',null,['MOOD']));
  main.appendChild(mk('div','mood-row',null, MOODS.map(function(m){
    var sel = state.mood === m.id;
    return mk('button','mpill'+(sel?' sel':''),{style:sel?{background:m.color,borderColor:m.color,color:'#fff'}:{},onclick:function(){set({mood:state.mood===m.id?null:m.id});}},[ m.id ]);
  })));

  // VOCAL
  main.appendChild(mk('div','slabel',null,['VOCAL']));
  main.appendChild(mk('div','vocal-row',null, VOCALS.map(function(v){
    return mk('button','vbtn'+(state.vocal===v?' sel':''),{onclick:function(){set({vocal:state.vocal===v?null:v});}},[ v ]);
  })));

  // BUILD YOUR SONG
  main.appendChild(mk('button','etoggle',{style:{color:state.songOpen?'#9a8aee':'#3a2a18'},onclick:function(){set({songOpen:!state.songOpen});}},[ mk('span','earrow',{style:{transform:state.songOpen?'rotate(90deg)':'rotate(0deg)'}},[ '›' ]), state.songOpen ? '← HIDE SONG' : 'BUILD YOUR SONG →', !state.songOpen ? mk('span','ehint',null,['ONE LINE · AI BUILDS AROUND IT · VERSE · CHORUS']) : null ]));

  if (state.songOpen) {
    var seedKids = [
      mk('div','seed-title',null,['Your line']),
      mk('div','seed-desc',null,["One line. A movie title. A headline. Something that won't leave you alone."]),
      mk('textarea','seed-ta',{rows:'3',placeholder:'"She left her shoes at the bottom of the stairs"',oninput:function(e){state.seed=e.target.value;}},[state.seed]),
      mk('div','seed-rlabel',null,['THIS FEELS LIKE MY...']),
      mk('div','seed-roles',null, SEED_ROLES.map(function(role){ return mk('button','srole'+(state.seedRole===role?' sel':''),{onclick:function(){set({seedRole:state.seedRole===role?null:role});}},[ role ]); })),
      mk('button','sbuild',{disabled:(!state.seed.trim()||state.seedBuilding)||undefined,onclick:buildSeed},[ state.seedBuilding ? 'BUILDING...' : '✦ BUILD AROUND THIS' ])
    ];
    if (state.seedResult) {
      seedKids = seedKids.concat([ mk('div','sresult',null,[ mk('div','srlabel',null,['CO-WRITER — built around your line']), mk('pre','srtext',null,[state.seedResult]), mk('button','applybtn',{onclick:function(){applyToSong(state.seedResult);}},['↓ APPLY TO SONG BELOW']) ]) ]);
    }
    main.appendChild(mk('div','seed-panel',null, seedKids));
    main.appendChild(mk('div','slabel',{style:{marginBottom:'10px'}},['FULL SONG — edit freely']));
    LYRIC_IDS.forEach(function(id,i){
      main.appendChild(mk('div',null,null,[ mk('div','llabel',null,[LYRIC_LABELS[i]]), mk('textarea','lta'+(state.lyrics[id]?' hc':''),{rows:id==='chorus'?'4':'3',placeholder:LYRIC_PLACEHOLDERS[i],oninput:function(e){state.lyrics[id]=e.target.value;}},[state.lyrics[id]]) ]));
    });
  }

  // GO DEEPER
  main.appendChild(mk('button','etoggle',{style:{color:state.deepOpen?'#c8a96e':'#3a2a18',marginTop:'8px'},onclick:function(){set({deepOpen:!state.deepOpen});}},[ mk('span','earrow',{style:{transform:state.deepOpen?'rotate(90deg)':'rotate(0deg)'}},[ '›' ]), state.deepOpen ? '← KEEP IT SIMPLE' : 'GO DEEPER →', !state.deepOpen ? mk('span','ehint',null,['BPM · KEY · INSTRUMENTS · ERA']) : null ]));

  if (state.deepOpen) {
    function makeDeepSel(opts, val, onch) {
      var s = mk('select','dsel',{onchange:onch});
      opts.forEach(function(o){ var opt=mk('option',null,{value:o},[o||'-- select']); if(o===val) opt.selected=true; s.appendChild(opt); });
      return s;
    }
    var deepKids = [
      mk('div','dlabel',null,['SIMPLE BY DEFAULT · DEEP ON DEMAND']),
      mk('div','dstitle',null,['Vocal Detail']),
      mk('div','dtags',null, DEEP_VOCALS.map(function(v){ return mk('button','dtag'+(state.deepVocal===v?' sel':''),{onclick:function(){set({deepVocal:state.deepVocal===v?'':v});}},[ v ]); })),
      mk('div','dstitle',null,['Genre Detail']),
      mk('div','dtags',null, DEEP_GENRES.map(function(g){ return mk('button','dtag'+(state.deepGenres.indexOf(g)>=0?' sel':''),{onclick:function(){dtoggle(state.deepGenres,g);set({});}},[ g ]); })),
      mk('div','dstitle',null,['Mood Detail']),
      mk('div','dtags',null, DEEP_MOODS.map(function(m){ return mk('button','dtag'+(state.deepMoods.indexOf(m)>=0?' sel':''),{onclick:function(){dtoggle(state.deepMoods,m);set({});}},[ m ]); })),
      mk('div','dstitle',null,['Instruments']),
      mk('div','dtags',null, DEEP_INSTRUMENTS.map(function(i){ return mk('button','dtag'+(state.deepInstruments.indexOf(i)>=0?' sel':''),{onclick:function(){dtoggle(state.deepInstruments,i);set({});}},[ i ]); })),
      mk('div','dstitle',null,['Era']),
      mk('div','dtags',null, DEEP_ERAS.map(function(e){ return mk('button','dtag'+(state.deepEra.indexOf(e)>=0?' sel':''),{onclick:function(){dtoggle(state.deepEra,e);set({});}},[ e ]); })),
      mk('div','dstitle',null,['Key / BPM / Time']),
      mk('div','dinputs',null,[
        mk('input','dinput',{type:'text',placeholder:'BPM',value:state.bpm,oninput:function(e){state.bpm=e.target.value.replace(/[^0-9]/g,'').slice(0,3);}}),
        makeDeepSel(KEYS, state.songKey, function(e){state.songKey=e.target.value;}),
        makeDeepSel(['','4/4','3/4','6/8','5/4','7/8','7/4','Shifting','Rubato'], state.timeSig, function(e){state.timeSig=e.target.value;})
      ])
    ];
    main.appendChild(mk('div','dpanel',null, deepKids));
  }

  // GENERATE
  main.appendChild(mk('button','genbtn',{disabled:state.loading||undefined,onclick:generate},[ state.loading ? 'GENERATING...' : 'GENERATE SUNO PROMPT' ]));
  main.appendChild(mk('div','gstatus',null,[ state.genre ? state.genre + (state.mood?' · '+state.mood:'') + (state.vocal?' · '+state.vocal:'') + (state.seed?' · seed active':'') : 'choose a genre above, or just generate' ]));

  // OUTPUT
  if (state.generatedPrompt) {
    var cc = state.generatedPrompt.length;
    var ccColor = cc > 950 ? '#e05555' : cc > 800 ? '#e09455' : '#5a9a5a';
    main.appendChild(mk('div',null,null,[
      mk('div','outbox',null,[ mk('div','outtext',{contenteditable:'true',oninput:function(e){state.generatedPrompt=e.textContent;}},[state.generatedPrompt]) ]),
      mk('div','outfooter',null,[
        mk('span',null,{style:{fontSize:'10px',color:ccColor}},[cc + ' / 950 chars']),
        mk('div','output-btns',null,[
          mk('button','retrybtn',{onclick:generate},['↺ RETRY']),
          mk('button','copybtn'+(state.copied?' copied':''),{onclick:function(){ navigator.clipboard.writeText(state.generatedPrompt); set({copied:true}); setTimeout(function(){set({copied:false});},2000); }},[state.copied ? '✓ COPIED' : 'COPY TO SUNO'])
        ])
      ])
    ]));
  }

  app.appendChild(hdr);
  app.appendChild(main);
}

render();

</script>
